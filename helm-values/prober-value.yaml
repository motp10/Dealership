service:
  port: 9115

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        method: GET
        preferred_ip_protocol: ip4
        valid_status_codes: [200]

    get_all_cars:
      prober: http
      timeout: 10s
      http:
        method: GET
        headers:
          Content-Type: application/json
          Accept: application/json
        body: '{}'
        preferred_ip_protocol: ip4
        valid_status_codes: [200]

    create_stock_car_order:
      prober: http
      timeout: 10s
      http:
        method: POST
        headers:
          Content-Type: application/json
          Accept: application/json
        body: |
          {
            "clientId": "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb",
            "carId": "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
          }
        preferred_ip_protocol: ip4
        valid_status_codes: [200]


