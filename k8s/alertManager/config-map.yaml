apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: vector
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.mail.ru:465   # изменено на 465
      smtp_from: abcde-25@mail.ru
      smtp_auth_username: abcde-25@mail.ru
      smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
      smtp_require_tls: false 
    route:
      receiver: email
    receivers:
      - name: email
        email_configs:
          - to: abcde-25@mail.ru
            send_resolved: true
  
