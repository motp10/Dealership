apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    meta.helm.sh/release-name: collector
    meta.helm.sh/release-namespace: logging
  labels:
    app.kubernetes.io/instance: collector
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-logs-collector
    app.kubernetes.io/version: v1.53.0
    helm.sh/chart: victoria-logs-collector-0.3.8
  name: collector-victoria-logs-collector
  namespace: logging
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: collector
      app.kubernetes.io/name: victoria-logs-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: collector
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-logs-collector
    spec:
      containers:
        - args:
            - --envflag.enable
            - --envflag.prefix=VL_
            - --kubernetesCollector
            - --kubernetesCollector.includeNodeAnnotations=false
            - --kubernetesCollector.includeNodeLabels=false
            - --kubernetesCollector.includePodAnnotations=false
            - --kubernetesCollector.includePodLabels
            - --kubernetesCollector.msgField=message,msg,log
            - --kubernetesCollector.streamFields=kubernetes.container_name,kubernetes.pod_name,kubernetes.pod_namespace
            - --kubernetesCollector.timeField=time,ts,timestamp
            - --loggerFormat=json
            - --remoteWrite.headers=AccountID:0^^ProjectID:0
            - --remoteWrite.url=http://vls-victoria-logs-single-server:9428/insert/native
            - --tmpDataPath=/var/lib/vl-collector
          image: victoriametrics/vlagent:v1.53.0
          imagePullPolicy: IfNotPresent
          name: vlagent
          ports:
            - containerPort: 9429
              name: http
              protocol: TCP
          resources: {}
          securityContext: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/log
              name: varlog
              readOnly: true
            - mountPath: /var/lib
              name: varlib
              readOnly: true
            - mountPath: /var/lib/vl-collector
              name: vl-collector-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: collector-victoria-logs-collector
      serviceAccountName: collector-victoria-logs-collector
      terminationGracePeriodSeconds: 30
      volumes:
        - hostPath:
            path: /var/log
            type: ""
          name: varlog
        - hostPath:
            path: /var/lib
            type: ""
          name: varlib
        - hostPath:
            path: /var/lib/vl-collector
            type: ""
          name: vl-collector-data
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
