remoteWrite:
  - url: http://vmsingle-monitoring-server.monitoring.svc.cluster.local:8428/api/v1/write

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 200m
    memory: 250Mi

service:
  enabled: true
  servicePort: 8429

config:
  global:
    scrape_interval: 30s

  scrape_configs:
    - job_name: backend-prober
      metrics_path: /probe
      params:
        module: [get_all_cars]
      static_configs:
        - targets:
            - http://backend.default.svc.cluster.local:8080/api/cars
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target

        - source_labels: [__param_target]
          target_label: instance

        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
          
    - job_name: stock-car-order-prober
      metrics_path: /probe
      params:
        module: [create_stock_car_order]
      static_configs:
        - targets:
            - http://backend.default.svc.cluster.local:8080/api/stockCars
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
    
    - job_name: postgres-exporter
      metrics_path: /metrics
      static_configs:
        - targets:
            - postgres.default.svc.cluster.local:9187

    - job_name: 'kubernetes-services'
      kubernetes_sd_configs:
        - role: service

      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true

        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__

        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)