remoteWrite:
  - url: http://vmsingle-monitoring-server.monitoring.svc.cluster.local:8428/api/v1/write

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 200m
    memory: 250Mi

service:
  enabled: true
  servicePort: 8429

config:
  global:
    scrape_interval: 30s

  scrape_configs:
    - job_name: backend-prober
      metrics_path: /probe
      params:
        module: [get_all_cars]
      static_configs:
        - targets:
            - http://backend.default.svc.cluster.local:8080/api/cars
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target

        - source_labels: [__param_target]
          target_label: instance

        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115