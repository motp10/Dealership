apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8091"
    prometheus.io/path: "/actuator/prometheus"
spec:
  selector:
    app: backend
  ports:
    - name: management
      port: 8091
      targetPort: 8091

    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP