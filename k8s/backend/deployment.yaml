apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: dealership-backend:local

          ports:
            - containerPort: 8080
            - name: management
              containerPort: 8091

          envFrom:  
            - configMapRef:
                name: backend-config

            - secretRef:
                  name: backend-secret

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
            periodSeconds: 5
            failureThreshold: 3
            