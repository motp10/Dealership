apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend


    spec:
      containers:
        - name: backend
          image: dealership-backend:local

          ports:
            - containerPort: 8080

          envFrom:  
            - configMapRef:
                name: backend-config

            - secretRef:
                  name: backend-secret

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5