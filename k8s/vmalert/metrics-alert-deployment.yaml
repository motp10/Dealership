apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert-metrics
  namespace: vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert-metrics
  template:
    metadata:
      labels:
        app: vmalert-metrics
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:latest
          args:
            - -rule=/etc/vmalert/alerts.yaml

            - -datasource.url=http://vmsingle-monitoring-server.monitoring.svc.cluster.local:8428

            - -notifier.url=http://alertmanager:9093
            - -httpListenAddr=:8880

            - -remoteWrite.url=http://monitoring.vmsingle-monitoring-server.svc.cluster.local:8428
            - -external.url=http://vmalert.vector.svc:8880
          ports:
            - name: web
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules