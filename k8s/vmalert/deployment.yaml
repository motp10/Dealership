apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:latest
          args:
            - -rule=/etc/vmalert/alerts.yaml
            - -datasource.url=http://vls-victoria-logs-single-server.logging.svc.cluster.local:9428
            - -notifier.url=http://alertmanager:9093
            - -rule.defaultRuleType=vlogs
            - -httpListenAddr=:8880
          ports:
            - name: web
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules