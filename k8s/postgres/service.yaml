apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
    - port: 9187
      targetPort: metrics
      name: metrics

  type: ClusterIP