plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.graalvm.buildtools.native' version '0.10.3'
}

apply plugin: 'application'

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ru.matvey.dealership.App'
}

repositories {
    mavenCentral()
}

dependencies {
    // Подключаем платформу Spring Boot для автоматического управления версиями
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.5')

    implementation project(':commonLib')

    implementation 'io.grpc:grpc-netty-shaded:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'

    // Micrometer Tracing для Observability
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Lombok & MapStruct
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Конфигурация Native Image
bootBuildImage {
    builder = "paketobuildpacks/builder-jammy-tiny:latest"
    environment = [
            "BP_NATIVE_IMAGE": "true",
            "BP_NATIVE_IMAGE_BUILD_ARGUMENTS": "--initialize-at-run-time=ch.qos.logback,io.grpc.netty.shaded.io.netty,org.slf4j --allow-incomplete-classpath"
    ]
}

// Общие настройки компиляции
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.jvmArgs << "--add-opens=java.base/java.lang=ALL-UNNAMED"
}

// Правильная настройка AOT, которая не падает, если задачи нет
tasks.withType(org.springframework.boot.gradle.tasks.aot.ProcessAot).configureEach {
    environment "HIBERNATE_VALIDATOR_FAIL_FAST", "true"
}

test {
    useJUnitPlatform()
}