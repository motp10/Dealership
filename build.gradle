plugins {
    id 'java'
    id 'idea'
    id 'application'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ru.matvey.dealership.App'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-liquibase'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}

tasks.register('startDatabase', Exec) {
    group = 'application'
    description = 'Starts the local PostgreSQL database using Docker Compose.'
    commandLine 'docker', 'compose', '-f', 'docker/docker-file-dependency.yaml', 'up', '-d', '--wait'
}

tasks.register('bootRunLocal') {
    group = 'application'
    description = 'Starts PostgreSQL and runs the application with Swagger UI.'
    dependsOn 'startDatabase', 'bootRun'
}

tasks.named('bootRun') {
    mustRunAfter 'startDatabase'
    doFirst {
        environment 'SWAGGER_ENABLED', 'true'
        if (gradle.taskGraph.hasTask(':bootRunLocal')) {
            environment 'DB_URL', System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:8888/dealership_db'
            environment 'DB_USER', System.getenv('DB_USER') ?: 'postgres'
            environment 'DB_PASSWORD', System.getenv('DB_PASSWORD') ?: 'password123'
            environment 'MIGRATIONS_ENABLED', 'true'
            environment 'DB_CONTEXTS', 'demo'
        }
        def port = System.getenv('PORT') ?: '8080'
        println "Swagger UI: http://localhost:${port}/swagger-ui.html"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('integrationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}
tasks.named('check') { dependsOn 'integrationTest' }
tasks.named('bootJar') { archiveFileName = 'dealership.jar' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('dockerBuild', Exec) {
    group = 'docker'
    description = 'Builds the application JAR and Docker image.'
    dependsOn 'bootJar'
    commandLine 'docker', 'build',
            '-f', 'docker/Dockerfile',
            '-t', 'dealership:local',
            '.'
}

def composeEnvFile = file('.env').exists() ? '.env' : '.env.example'

tasks.register('dockerUp', Exec) {
    group = 'docker'
    description = 'Starts the full application stack in Docker Compose.'
    dependsOn 'dockerBuild'
    commandLine 'docker', 'compose',
            '--env-file', composeEnvFile,
            'up', '-d', '--wait'
    doLast {
        def output = new ByteArrayOutputStream()
        exec {
            commandLine 'docker', 'compose',
                    '--env-file', composeEnvFile,
                    'port', 'web', '8080'
            standardOutput = output
        }
        println "Swagger UI: http://${output.toString().trim()}/swagger-ui.html"
        println "Frontend: http://localhost:3000"
    }
}

tasks.register('dockerUpFrontendOnly', Exec) {
    group = 'docker'
    description = 'Starts only the frontend container.'
    commandLine 'docker', 'compose',
            '--env-file', composeEnvFile,
            'up', '-d', '--wait', 'frontend'
    doLast {
        println "Frontend: http://localhost:3000"
    }
}

tasks.register('dockerDown', Exec) {
    group = 'docker'
    description = 'Stops the full Docker Compose stack.'
    commandLine 'docker', 'compose',
            '--env-file', composeEnvFile,
            'down'
}

tasks.register('dockerDownV', Exec) {
    group = 'docker'
    description = 'Stops the full Docker Compose stack.'
    commandLine 'docker', 'compose',
            '--env-file', composeEnvFile,
            'down', '-v'
}
