services:
  db:
    image: postgres:16-alpine
    container_name: dealership_db
    environment:
      POSTGRES_DB: dealership_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealership_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8888:5432"
    volumes:
      - dealership_db_data:/var/lib/postgresql/data

volumes:
  dealership_db_data: