version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dealership_db
    environment:
      POSTGRES_DB: dealership_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "8888:5432"
    volumes:
      - dealership_db_data:/var/lib/postgresql/data

volumes:
  dealership_db_data: