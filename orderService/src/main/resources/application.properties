spring.datasource.url=jdbc:postgresql://localhost:8888/dealership_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=none
logging.level.liquibase=INFO
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/dealership-realm
jwt.auth.converter.resource-id=dealership-client
jwt.auth.converter.principal-attribute=preferred_username