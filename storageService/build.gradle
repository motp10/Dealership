plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.graalvm.buildtools.native' version '0.10.3'
    id 'java'
}

apply plugin: 'application'

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dealership.Main'
}

repositories {
    mavenCentral()
}

ext {
    mapstructVersion = '1.5.5.Final'
    lombokVersion = '1.18.30'
    hibernateVersion = '6.4.4.Final'
}

bootBuildImage {
    environment = [
            "BP_NATIVE_IMAGE": "true",
            "BP_NATIVE_IMAGE_BUILD_ARGUMENTS": "--initialize-at-run-time=ch.qos.logback,io.grpc.netty.shaded.io.netty,org.slf4j --allow-incomplete-classpath",
            "JAVA_TOOL_OPTIONS": "-Dspring.aot.enabled=true"
    ]
}

graalvmNative {
    binaries {
        main {
            buildArgs.add('--initialize-at-run-time=ch.qos.logback.core.util.StatusPrinter2')
            buildArgs.add('--initialize-at-run-time=ch.qos.logback.core.status.StatusBase')
            buildArgs.add('--initialize-at-run-time=io.grpc.netty.shaded.io.netty.buffer.UnpooledByteBufAllocator')
            buildArgs.add('--initialize-at-run-time=io.grpc.netty.shaded.io.netty.channel.epoll.Epoll')

            buildArgs.add('--initialize-at-run-time=io.grpc.netty.shaded.io.netty')
            buildArgs.add('--initialize-at-run-time=ch.qos.logback')
            buildArgs.add('--allow-incomplete-classpath')

            buildArgs.add('--initialize-at-run-time=ch.qos.logback,io.grpc.netty.shaded.io.netty,org.slf4j')
            buildArgs.add('--add-opens=java.base/java.lang=ALL-UNNAMED')
        }
    }
}


dependencies {
    implementation project(':commonLib')

    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.5')

    implementation 'io.grpc:grpc-netty-shaded:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'


    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-grpc-1.6:1.33.5-alpha'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.kafka:spring-kafka'

    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.jvmArgs << "--add-opens=java.base/java.lang=ALL-UNNAMED"
}

tasks.named('processAot') {
    systemProperty('org.hibernate.validator.fail_fast', 'true')
}

tasks.withType(org.springframework.boot.gradle.tasks.aot.ProcessAot) {
    environment "HIBERNATE_VALIDATOR_FAIL_FAST", "true"
}